---
- name: "Stop-mode backup of {{ guest }}"
  ansible.builtin.command:
    argv:
      - vzdump
      - "{{ hostvars[guest].vmid }}"
      - --mode
      - stop
      - --storage
      - "{{ backup_storage }}"
      - --compress
      - zstd
      - --protected
      - "1"
      - --prune-backups
      - keep-all=1
      - --notes-template
      - !unsafe "{{ guestname }} ansible"
  async: 3600
  poll: 15
  changed_when: true

- name: "List backups of {{ guest }}"
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ ansible_facts['hostname'] }}/storage/{{ backup_storage }}/content"
      - --content
      - backup
      - --vmid
      - "{{ hostvars[guest].vmid }}"
      - --output-format
      - json
  register: backup_list
  changed_when: false

- name: "Find older ansible backups of {{ guest }}"
  ansible.builtin.set_fact:
    old_backups: >-
      {{ (backup_list.stdout | from_json
          | selectattr('notes', 'defined')
          | selectattr('notes', 'search', ' ansible$')
          | sort(attribute='ctime')
          | map(attribute='volid') | list)[:-1] }}

- name: "Unprotect older ansible backups of {{ guest }}"
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/nodes/{{ ansible_facts['hostname'] }}/storage/{{ backup_storage }}/content/{{ item }}"
      - --protected
      - "0"
  loop: "{{ old_backups }}"
  changed_when: true

- name: "Delete older ansible backups of {{ guest }}"
  ansible.builtin.command:
    argv:
      - pvesm
      - free
      - "{{ item }}"
  loop: "{{ old_backups }}"
  changed_when: true
