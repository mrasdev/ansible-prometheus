---
# Play 1: OS packages on every LXC
- name: Update OS packages
  hosts: apt
  become: true

  environment:
    APT_LISTCHANGES_FRONTEND: none
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report hosts that need a reboot
      ansible.builtin.debug:
        msg: "Reboot required on {{ inventory_hostname }}"
      when: reboot_required.stat.exists

# Play 2: Docker images on hosts with compose_auto_update
- name: Update Docker Compose projects
  hosts: docker
  become: true

  tasks:
    - name: Pull new images
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} pull --quiet
      changed_when: false
      when: compose_auto_update | default(false)

    - name: Recreate containers with new images
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} up -d
      register: compose_up
      changed_when: "'Recreate' in compose_up.stderr"
      when: compose_auto_update | default(false)

    - name: Remove unused images
      ansible.builtin.command:
        cmd: docker image prune -f
      register: prune
      changed_when: "'Total reclaimed space: 0B' not in prune.stdout"
      when: compose_auto_update | default(false)

    - name: Remind about manual updates
      ansible.builtin.debug:
        msg: "Manual update: {{ inventory_hostname }} ({{ compose_file }})"
      when: not (compose_auto_update | default(false))
