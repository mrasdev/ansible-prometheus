# Copy to inventory/hosts.yml (git-ignored) and adjust

# Variables for all hosts
all:
  vars:
    ansible_user: root

# Ansible control node, gets the weekly update run (controller.yml)
controller:
  hosts:
    ansible01:
      ansible_connection: local

# Host that runs the Prometheus server (address is set in group "apt")
monitoring:
  hosts:
    prometheus01:

# Hosts that get node_exporter and are scraped by Prometheus
nodes:
  hosts:
    pve01:
      ansible_host: 192.0.2.20   # Proxmox host
  children:
    apt:                         # every container in "apt" is scraped, too

# Debian containers upgraded by update.yml
apt:
  hosts:
    prometheus01:
      ansible_host: 192.0.2.10   # Prometheus LXC, monitors itself, too
    app01:
      ansible_host: 192.0.2.30   # example LXC

# Containers with a Docker Compose stack (must also be in "apt")
docker:
  hosts:
    app01:
      compose_file: /root/docker-compose.yml
      compose_auto_update: true  # false: update.yml only prints a reminder
